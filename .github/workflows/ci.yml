name: CI

on:
  push:
    branches: [main]
    # Tags are covered too: release.yml re-runs the build and sanitizer
    # jobs for a tag, but not coverage, and a tag push does not match a
    # branch filter. Without this, tagging a release runs no CI at all.
    tags: ['v*']
  pull_request:
  # So the suite (and the coverage upload with it) can be run on demand
  # without inventing a commit.
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DMINIMOSQ_WERROR=ON

      - name: Build tests and examples
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Example binaries exist
        run: |
          ls -l build/examples/tcp_broker \
                build/examples/uds_broker \
                build/examples/pipe_broker

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DMINIMOSQ_WERROR=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # The library is all size_t arithmetic over fixed arrays, so a 32-bit
  # target is where an assumption that size_t is 64 bits would show up.
  build-test-32bit:
    name: build & test (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-multilib

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMINIMOSQ_WERROR=ON
          -DCMAKE_CXX_FLAGS=-m32

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # CMakeLists.txt carries an MSVC branch (/W4 /WX); without a job it is
  # never exercised. The POSIX transports and their tests are excluded
  # by the UNIX guards, so this covers the portable core.
  build-test-msvc:
    name: build & test (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build -DMINIMOSQ_WERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      # The measured percentage depends on the compiler. Different GCC
      # releases instrument a different number of lines in template-heavy
      # headers, and this library is nothing but template-heavy headers:
      # the same tree measured 94.7% under GCC 11 and 87% under the
      # runner's default. Neither is wrong, but only a pinned compiler
      # makes the number comparable between runs and reproducible
      # locally, which is what a floor needs to mean anything.
      CXX_FOR_COVERAGE: g++-13
      GCOV_FOR_COVERAGE: gcov-13
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned compiler
        run: sudo apt-get update && sudo apt-get install -y g++-13

      # -O0 keeps gcov line attribution honest; inlining at -O2 smears
      # header lines across call sites and inflates the result.
      - name: Configure with coverage instrumentation
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ env.CXX_FOR_COVERAGE }}
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # tools/coverage.py merges per-instantiation gcov records instead
      # of summing them; see the comment at the top of that file for why
      # a plain gcovr run reports roughly 58% for this codebase.
      - name: Measure coverage
        run: >
          python3 tools/coverage.py
          --build-dir build
          --gcov "${{ env.GCOV_FOR_COVERAGE }}"
          --xml coverage.xml
          --summary "$GITHUB_STEP_SUMMARY"
          --json coverage.json
          --show-missing
          --fail-under-line 85
          --fail-under-branch 72

      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: headers
          name: minimosq-headers
          # Public-repo uploads work without a token; the secret is used
          # when present so pushes to a protected branch are accepted.
          token: ${{ secrets.CODECOV_TOKEN }}
          # The coverage floor above is the real gate — a Codecov outage
          # must not fail a build that met it. continue-on-error keeps the
          # job green while the step below still reports what happened, so
          # "badge says unknown" is never a silent failure.
          fail_ci_if_error: true

      - name: Report the upload result
        if: always()
        run: |
          if [ "${{ steps.codecov.outcome }}" = "success" ]; then
            echo "Codecov upload succeeded."
          else
            echo "::warning::Codecov upload FAILED — the badge will read 'unknown'."
            echo "The coverage gate itself passed; only the upload is affected."
            echo ""
            echo "Most likely causes, in order:"
            echo "  1. The repository is not activated at https://codecov.io/gh/${{ github.repository }}"
            echo "  2. A CODECOV_TOKEN secret is required (protected branch, or"
            echo "     tokenless uploads disabled for the org) and is not set."
            echo "  3. Codecov was unreachable."
            echo ""
            echo "coverage.xml is attached to this run as an artifact either way."
          fi

      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json

  smoke:
    name: mosquitto smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mosquitto clients
        run: sudo apt-get update && sudo apt-get install -y mosquitto-clients

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMINIMOSQ_WERROR=ON

      - name: Build the TCP example broker
        run: cmake --build build -j"$(nproc)" --target tcp_broker

      - name: Run smoke test against real clients
        run: sh tests/smoke_mosquitto.sh build/examples/tcp_broker
