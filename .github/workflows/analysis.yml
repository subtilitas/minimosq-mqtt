name: Analysis

# Static analysis, kept separate from ci.yml so a finding here never
# looks like a build or test failure.
#
# clang-format is a gate: the tree was normalised in ee8ded5 and stays
# that way. The version is pinned via pip rather than taken from the
# runner image, because different clang-format releases format the same
# code differently — an unpinned check would flip red on an image bump
# with no code change, and would disagree with whatever developers have
# installed locally. Upgrade deliberately: bump the pin, re-run
# `clang-format -i` over the tree, commit both together, and add the
# commit to .git-blame-ignore-revs.
#
# clang-tidy is also a gate, as of cf95e0d. Its first run reported 704
# findings; 641 came from two checks that do not suit this codebase and
# are suppressed with their reasoning in .clang-tidy, the rest were
# fixed. The tree now reports zero against the pinned version, so any
# finding is a new one.
#
# CodeQL stays reporting-only: its findings land in the Security tab
# rather than in the log, and the way to make it blocking is to require
# the code-scanning check in branch protection rather than to fail here.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # CodeQL's query packs get updated independently of this repository,
    # so a weekly run catches newly published queries against unchanged
    # code. Monday 07:00 UTC.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    env:
      # Keep in step with the pin in the header comment above.
      CLANG_FORMAT_VERSION: 18.1.3
    steps:
      - uses: actions/checkout@v6

      - name: Install a pinned clang-format
        run: |
          set -eu
          # pipx ships on the GitHub runner images, but fall back to pip
          # rather than depending on that.
          pipx install "clang-format==${CLANG_FORMAT_VERSION}" \
            || pip install --user "clang-format==${CLANG_FORMAT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          set -uo pipefail
          clang-format --version
          files=$(find include tests examples tools -type f \
                    \( -name '*.hpp' -o -name '*.cpp' \) | sort)
          echo "checking $(echo "$files" | wc -l) files against .clang-format"

          # Report which files differ, and by how much, rather than only
          # that something does.
          dirty=""
          for f in $files; do
            if ! clang-format --dry-run --Werror "$f" >/dev/null 2>&1; then
              n=$(clang-format "$f" | diff -u "$f" - | grep -c '^[+-][^+-]' || true)
              dirty="$dirty$f ($n lines)\n"
            fi
          done

          {
            echo "## clang-format"
            echo ""
            if [ -z "$dirty" ]; then
              echo "All $(echo "$files" | wc -l) files match \`.clang-format\`."
            else
              echo "Files differing from \`.clang-format\`:"
              echo ""
              echo '```'
              printf "%b" "$dirty"
              echo '```'
              echo ""
              echo "Fix in one pass, with the same version CI uses:"
              echo ""
              echo '```sh'
              echo "pipx install 'clang-format==${CLANG_FORMAT_VERSION}'"
              echo "clang-format -i \$(find include tests examples tools \\"
              echo "  -type f \\( -name '*.hpp' -o -name '*.cpp' \\))"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$dirty" ]; then
            printf "%b" "$dirty"
            echo "::error::Some files differ from .clang-format."
            exit 1
          fi
          echo "All files match .clang-format."

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    env:
      # Pinned for the same reason as clang-format: check sets and
      # analyzer behaviour change between releases, and an unpinned tool
      # turns the gate red on an image bump with no code change.
      CLANG_TIDY_VERSION: 18.1.1
    steps:
      - uses: actions/checkout@v6

      - name: Install a pinned clang-tidy
        run: |
          set -eu
          pipx install "clang-tidy==${CLANG_TIDY_VERSION}" \
            || pip install --user "clang-tidy==${CLANG_TIDY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # clang-tidy needs to know how each file is compiled. The library
      # is header-only, so the headers are analysed through the test and
      # example translation units that include them; HeaderFilterRegex in
      # .clang-tidy limits the diagnostics to include/minimosq.
      - name: Generate a compilation database
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        id: tidy
        run: |
          set -uo pipefail
          clang-tidy --version
          files=$(find tests examples tools -name '*.cpp' | sort)
          # -quiet suppresses the per-file "N warnings generated" noise;
          # the header filter means most files legitimately report none.
          clang-tidy -p build --quiet $files 2>/dev/null | tee tidy.log || true
          # Deduplicate: a header included by 15 translation units
          # otherwise reports the same finding 15 times.
          grep -E '(warning|error):' tidy.log | sort -u > tidy-unique.log || true
          count=$(wc -l < tidy-unique.log)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count unique finding(s)"
          # The tree is clean as of cf95e0d, so any finding is new. The
          # summary step below still runs and prints them.
          if [ "$count" -ne 0 ]; then
            cat tidy-unique.log
            echo "::error::clang-tidy reported $count finding(s)."
            exit 1
          fi

      - name: Publish the findings
        if: always()
        run: |
          {
            echo "## clang-tidy"
            echo ""
            if [ "${{ steps.tidy.outputs.count }}" = "0" ]; then
              echo "No findings."
            else
              echo "**${{ steps.tidy.outputs.count }} unique finding(s)**, deduplicated"
              echo "across translation units. The tree was clean as of cf95e0d,"
              echo "so these are new."
              echo ""
              echo '```'
              head -100 tidy-unique.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: |
            tidy.log
            tidy-unique.log

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # to upload results to the Security tab
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          # security-and-quality adds maintainability queries on top of
          # the default security set. Worth it here: the codebase is
          # small enough that the extra findings stay reviewable.
          queries: security-and-quality

      # CodeQL observes a real build. Examples and tools are included so
      # the POSIX transports are covered, not just the portable core.
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j"$(nproc)"

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
